# Production-like stack for local testing: MySQL, Redis, Django (Gunicorn),
# Celery worker and Celery beat (scheduler).
#   Start:  docker compose up --build -d
#   Open:   http://127.0.0.1:8080
#   Stop:   docker compose down          (data stays in the volumes)

x-app: &app
  build: .
  image: profile-onboarder:latest
  env_file: .env.docker
  volumes:
    - media:/app/media
  restart: unless-stopped

services:
  db:
    image: mysql:8.4
    env_file: .env.docker
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped   # no "ports:": reachable only inside the Docker network

  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

volumes:
  mysql_data:
  media: