{% extends "base.html" %}

{% block title %}Log in · Profile Onboarder{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <h1 class="h3 mb-3">Log in</h1>
        <div class="card shadow-sm">
            <div class="card-body">
                {% if form.non_field_errors %}
                    <div class="alert alert-danger">
                        {% for error in form.non_field_errors %}{{ error }}{% endfor %}
                    </div>
                {% endif %}

                <form method="post" novalidate>
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">

                    <div class="mb-3">
                        <label for="{{ form.username.id_for_label }}" class="form-label">Email address</label>
                        <input type="email" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}"
                               value="{{ form.username.value|default:'' }}" class="form-control"
                               autocomplete="email" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="{{ form.password.id_for_label }}" class="form-label">Password</label>
                        <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}"
                               class="form-control" autocomplete="current-password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Log in</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
