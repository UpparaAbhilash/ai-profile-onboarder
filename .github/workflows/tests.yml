# Runs on every push and pull request: a fresh Linux machine installs the project
# from scratch and runs all checks. Free for this repository.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password   # throwaway CI database, not a real secret
          MYSQL_DATABASE: profile_onboarder
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "False"
      DB_NAME: profile_onboarder
      DB_USER: root
      DB_PASSWORD: ci-root-password
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"

    steps:
      - name: Check out the code (full history for the secret scan)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact
      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install system packages for mysqlclient
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev

      - name: Install Python packages
        run: pip install -r requirements-dev.txt

      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run all tests with coverage
        run: |
          coverage run manage.py test
          coverage report

      - name: Django deployment checks
        run: python manage.py check --deploy --fail-level ERROR

      - name: Dependency audit (known vulnerabilities)
        run: pip-audit -r requirements.txt